# Supabase CLI config for local development (`supabase start`).
# The hosted project is linked separately with `supabase link --project-ref <ref>`.
project_id = "downer"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
enable_signup = true

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
