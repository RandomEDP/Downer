name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          ios=[(k,v) for k,v in d.items() if "iOS" in k]
          ios.sort(key=lambda kv: [int(x) for x in kv[0].rsplit("iOS-",1)[1].split("-")])
          for k,v in reversed(ios):
              for dev in v:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Downer.xcodeproj \
            -scheme Downer \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning: |Test|\*\*" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log

  supabase:
    name: Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check migration numbering
        run: scripts/check-migrations.sh
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations to a local database
        run: supabase db start
      - name: Lint database
        run: supabase db lint --local --fail-on error
